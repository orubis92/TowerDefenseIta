<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7a2e1d">
  <title>Trattoria Defense</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">🍕 Trattoria Defense</div>
      <div class="stats">
        <span class="stat" title="Mance (oro)">💰 <b id="stat-gold">0</b></span>
        <span class="stat" title="Clienti soddisfatti (vite)">❤️ <b id="stat-lives">0</b></span>
        <span class="stat" title="Ondata">🌊 <b id="stat-wave">0</b>/<span id="stat-wave-max">10</span></span>
      </div>
      <div class="controls">
        <button id="btn-speed" class="btn small" title="Velocità di gioco">⏩ 1×</button>
        <button id="btn-pause" class="btn small" title="Pausa">⏸</button>
      </div>
    </header>

    <main id="main">
      <div id="canvas-wrap">
        <canvas id="game" width="768" height="480"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h1 id="overlay-title">Trattoria Defense</h1>
            <p id="overlay-text"></p>
            <button id="overlay-btn" class="btn primary">Inizia il servizio</button>
          </div>
        </div>
      </div>

      <aside id="sidebar">
        <section class="panel">
          <h2>Brigata di cucina</h2>
          <div id="shop" class="shop"></div>
          <p class="hint" id="shop-hint">Scegli un cuoco, poi tocca una piastrella libera per piazzarlo.</p>
        </section>

        <section class="panel" id="selection-panel">
          <h2>Postazione</h2>
          <div id="selection-empty" class="hint">Tocca una postazione per potenziarla o venderla.</div>
          <div id="selection-info" class="hidden">
            <div class="sel-head"><span id="sel-emoji" class="sel-emoji"></span><div><div id="sel-name" class="sel-name"></div><div id="sel-level" class="sel-level"></div></div></div>
            <ul class="sel-stats">
              <li>Danno: <b id="sel-dmg"></b></li>
              <li>Gittata: <b id="sel-range"></b></li>
              <li>Cadenza: <b id="sel-rate"></b>/s</li>
              <li>Uccisioni: <b id="sel-kills"></b></li>
            </ul>
            <div class="sel-actions">
              <button id="btn-upgrade" class="btn">⬆️ Potenzia</button>
              <button id="btn-sell" class="btn danger">💸 Vendi</button>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>Ondata</h2>
          <div id="wave-preview" class="wave-preview"></div>
          <button id="btn-wave" class="btn primary wide">▶️ Fai entrare i clienti</button>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
